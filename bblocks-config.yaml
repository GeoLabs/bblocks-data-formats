name: Data Formats

abstract: |
  A content register (ISO 19135:2026, via the Registered Item Model) of the formats in which OSPD
  process inputs and outputs are encoded, and of the representations that bind a data type of the
  data-types register to a format.

description: |
  The content plane of the OSPD data axis. A **format** (`df:Format`) is an encoding: its
  specification, the media types observed where it is served, and/or a JSON Schema fragment. It
  realizes no concept. A **representation** (`df:Representation`) realizes one data type version of
  [GeoLabs/bblocks-data-types](https://github.com/GeoLabs/bblocks-data-types), the concept plane, and
  points to one format.

  Identifiers are minted under `https://w3id.org/geolabs-ospd/data-formats/` (prefix `df:`). This
  namespace is not resolved yet.

contact:
  name: GeoLabs SARL
  url: https://www.geolabs.fr/

version: 0.1.0

identifier-prefix: data-formats.

baseURL: https://geolabs.github.io/bblocks-data-formats/
gitHubBaseURL: https://github.com/GeoLabs/bblocks-data-formats/

keywords:
  - format
  - media type
  - representation
  - content plane
  - ISO 19135
  - register

imports:
  - default
  # Registered Item Model (ISO 19135:2026): every format and representation is a rim:RegisterItem.
  - https://ogcincubator.github.io/registered-item-model/build/register.json
  # Data types (concept plane): a representation realizes one of their versions. This register
  # depends on data-types, never the reverse.
  - https://geolabs.github.io/bblocks-data-types/build/register.json

schema-oas30-downcompile: False

license: Apache-2.0
