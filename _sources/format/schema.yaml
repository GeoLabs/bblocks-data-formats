$schema: https://json-schema.org/draft/2020-12/schema
title: Format item
description: >-
  A format of the data-formats register, in JSON: a profile of the Registered Item Model register
  item (`type` pinned to `Format`). A format realizes no concept version (`realizes` is forbidden);
  it names its specification and carries the media types observed where it is served and/or a JSON
  Schema fragment, with its parameters when the fragment is completed by the profile.
allOf:
  - $ref: bblocks://ogc.rim.schemas.register-item
type: object
required: [specification, hasAction]
anyOf:
  - required: [observedMediaTypes]
  - required: [jsonSchemaFragment]
not:
  required: [realizes]
properties:
  type: {const: Format}
  itemClass: {const: https://w3id.org/geolabs-ospd/data-formats/formatItemClass}
  inRegister: {const: https://w3id.org/geolabs-ospd/data-formats/register}
  specification:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, title]
      properties:
        id: {type: string, format: uri}
        title: {type: string}
  observedMediaTypes:
    type: array
    minItems: 1
    items:
      type: object
      required: [mediaType, observedIn]
      properties:
        mediaType: {type: string}
        observedIn: {enum: [implementation-profile, testbed]}
  inferredMediaTypes:
    description: >-
      Media types not observed but inferred (e.g. from the format's JSON Schema, when its
      specification states none), each with its source and justification.
    type: array
    minItems: 1
    items:
      type: object
      required: [mediaType, source, description]
      properties:
        mediaType: {type: string}
        source: {type: string, format: uri}
        description: {type: string}
  primaryMediaType: {type: string}
  jsonSchemaFragment: {type: object}
  parameters:
    type: array
    items:
      type: object
      required: [name, jsonSchemaKeyword]
      properties:
        name: {type: string}
        jsonSchemaKeyword: {type: string}
        description: {type: string}
  cwlCustomType:
    description: The record of the EOAP string_format.yaml that carries this format in CWL.
    type: string
  seeAlso: {type: string, format: uri}
  hasAction:
    description: >-
      The proposed addition, alone or followed by in-place amendments of the proposal
      (df:amendmentAction, always classified).
    oneOf:
      - $ref: '#/$defs/addition'
      - type: array
        contains: {$ref: '#/$defs/addition'}
        items:
          oneOf:
            - $ref: '#/$defs/addition'
            - $ref: '#/$defs/amendment'
$defs:
  addition:
    type: object
    required: [id, actionType, proposer]
    properties:
      id: {type: string, format: uri}
      type: {const: RegisterAction}
      actionType: {const: addition}
      proposer: {type: string, format: uri}
      startedAtTime: {type: string, format: date-time}
  amendment:
    type: object
    required: [id, actionType, changeClassification, proposer]
    properties:
      id: {type: string, format: uri}
      type: {const: RegisterAction}
      actionType: {const: https://w3id.org/geolabs-ospd/data-formats/amendmentAction}
      changeClassification: {enum: [clarifying, substantive]}
      proposer: {type: string, format: uri}
      startedAtTime: {type: string, format: date-time}
      description: {type: string}
