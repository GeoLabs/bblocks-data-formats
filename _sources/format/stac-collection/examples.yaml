examples:
  - title: STAC Collection
    content: >-
      The register item of the STAC Collection format, of the register's format item class.
    snippets:
      - language: json
        code: |
          {
            "id": "https://w3id.org/geolabs-ospd/data-formats/format/stac-collection",
            "type": "Format",
            "objectIdentifier": "https://w3id.org/geolabs-ospd/data-formats/format/stac-collection",
            "itemClass": "https://w3id.org/geolabs-ospd/data-formats/formatItemClass",
            "inRegister": "https://w3id.org/geolabs-ospd/data-formats/register",
            "specification": [
