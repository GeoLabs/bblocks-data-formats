            "publicationStatus": "published",
            "hasAction": {
              "id": "https://w3id.org/geolabs-ospd/data-formats/format/stac-collection/actions/addition",
              "type": "RegisterAction",
              "actionType": "addition",
              "proposer": "https://w3id.org/geolabs-ospd/data-formats/geolabs",
