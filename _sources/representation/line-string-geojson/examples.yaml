examples:
  - title: LineString as GeoJSON
    content: >-
      The register item of the representation LineString as GeoJSON: it realizes version 1 of the line-string data type of the data-types register and points to the geojson format.
    snippets:
      - language: json
        code: |
          {
            "id": "https://w3id.org/geolabs/ospd/data-formats/representation/line-string-geojson",
            "type": "Representation",
            "objectIdentifier": "https://w3id.org/geolabs/ospd/data-formats/representation/line-string-geojson",
            "itemClass": "https://w3id.org/geolabs/ospd/data-formats/representationItemClass",
            "inRegister": "https://w3id.org/geolabs/ospd/data-formats/register",
            "realizes": "https://w3id.org/geolabs/ospd/data-types/data-type/line-string/v1",
            "format": "https://w3id.org/geolabs/ospd/data-formats/format/geojson",
            "jsonSchemaFragment": {
              "$ref": "https://geojson.org/schema/LineString.json"
            },
            "validityStatus": "invalid",
            "publicationStatus": "published",
            "hasAction": {
              "id": "https://w3id.org/geolabs/ospd/data-formats/representation/line-string-geojson/actions/addition",
              "type": "RegisterAction",
              "actionType": "addition",
              "proposer": "https://w3id.org/geolabs/ospd/org/geolabs",
              "appliesTo": "https://w3id.org/geolabs/ospd/data-formats/representation/line-string-geojson",
              "startedAtTime": "2026-11-17T00:00:00Z"
            }
          }
      - language: turtle
        ref: ontology.ttl
