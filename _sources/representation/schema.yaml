$schema: https://json-schema.org/draft/2020-12/schema
title: Representation item
description: >-
  A representation of the data-formats register, in JSON: a profile of the Registered Item Model
  register item (`type` pinned to `Representation`). It realizes exactly one data type version of
  the data-types register (`realizes`) and points to one format of this register (`format`).
allOf:
  - $ref: bblocks://ogc.rim.schemas.register-item
type: object
required: [realizes, format, hasAction]
properties:
  type: {const: Representation}
  itemClass: {const: https://w3id.org/geolabs-ospd/data-formats/representationItemClass}
  inRegister: {const: https://w3id.org/geolabs-ospd/data-formats/register}
  realizes:
    type: string
    format: uri
    pattern: ^https://geolabs\.github\.io/bblocks-data-types/def/data-type/[a-z0-9-]+/v[0-9]+$
  format:
    type: string
    format: uri
    pattern: ^https://w3id\.org/geolabs-ospd/data-formats/format/[a-z0-9-]+$
  hasAction:
    description: >-
      The proposed addition, alone or followed by in-place amendments of the proposal
      (df:amendmentAction, always classified), as for a format.
    oneOf:
      - $ref: '#/$defs/addition'
      - type: array
        contains: {$ref: '#/$defs/addition'}
        items:
          oneOf:
            - $ref: '#/$defs/addition'
            - $ref: '#/$defs/amendment'
$defs:
  addition:
    type: object
    required: [id, actionType, proposer]
    properties:
      id: {type: string, format: uri}
      type: {const: RegisterAction}
      actionType: {const: addition}
      proposer: {type: string, format: uri}
      startedAtTime: {type: string, format: date-time}
  amendment:
    type: object
    required: [id, actionType, changeClassification, proposer]
    properties:
      id: {type: string, format: uri}
      type: {const: RegisterAction}
      actionType: {const: https://w3id.org/geolabs-ospd/data-formats/amendmentAction}
      changeClassification: {enum: [clarifying, substantive]}
      proposer: {type: string, format: uri}
      startedAtTime: {type: string, format: date-time}
      description: {type: string}
