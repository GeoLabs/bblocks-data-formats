examples:
  - title: Single-band raster as GeoTIFF
    content: >-
      The register item of the representation Single-band raster as GeoTIFF: it realizes version 1 of the raster-single-band
      data type of the data-types register and points to the geotiff format.
    snippets:
      - language: json
        code: |
          {
            "id": "https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-geotiff",
            "type": "Representation",
            "objectIdentifier": "https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-geotiff",
            "itemClass": "https://w3id.org/geolabs/ospd/data-formats/representationItemClass",
            "inRegister": "https://w3id.org/geolabs/ospd/data-formats/register",
            "realizes": "https://geolabs.github.io/bblocks-data-types/def/data-type/raster-single-band/v1",
            "format": "https://w3id.org/geolabs/ospd/data-formats/format/geotiff",
            "validityStatus": "invalid",
            "publicationStatus": "published",
            "hasAction": {
              "id": "https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-geotiff/actions/addition",
              "type": "RegisterAction",
              "actionType": "addition",
              "proposer": "https://w3id.org/geolabs/ospd/data-formats/geolabs",
              "appliesTo": "https://w3id.org/geolabs/ospd/data-formats/representation/raster-single-band-geotiff",
              "startedAtTime": "2026-11-09T00:00:00Z"
            }
          }
      - language: turtle
        ref: ontology.ttl
