$schema: https://json-schema.org/draft/2020-12/schema
title: Data Formats item class
description: >-
  One of the two item classes of the data-formats register, in JSON: format or representation. Each
  is defined in the register and validated by a shape of the shared vocabulary.
allOf:
  - $ref: bblocks://ogc.rim.schemas.register-item-class
required: [definedIn, validatedBy]
properties:
  id:
    enum:
      - https://w3id.org/geolabs-ospd/data-formats/formatItemClass
      - https://w3id.org/geolabs-ospd/data-formats/representationItemClass
